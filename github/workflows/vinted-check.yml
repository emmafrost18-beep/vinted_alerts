name: Vinted watcher

on:
  schedule:
    # Every 2 hours (120 minutes). Cron only takes whole hours for this
    # interval, so "0 */2 * * *" is the closest exact match.
    - cron: "0 */2 * * *"
  workflow_dispatch: {} # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write # needed so the workflow can commit the updated state file

env:
  SEARCH_URL: "https://www.vinted.co.uk/catalog?search_text=cos%20denim%20shirt&catalog[]=222&material_ids[]=303&brand_ids[]=2029&color_ids[]=9&color_ids[]=27&size_ids[]=3&status_ids[]=1&status_ids[]=2&status_ids[]=6&order=newest_first"
  NTFY_TOPIC: "aa-denim-onvinted"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run watcher
        run: python vinted_check.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_items.json
          git diff --staged --quiet || git commit -m "Update seen Vinted listings"
          git push
